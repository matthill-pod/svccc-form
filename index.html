<!DOCTYPE html>
<html>
<head>
  <title>SVCCC Trip Logger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { height: 50px; }
    h2 { text-align: center; color: #333; margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: bold; color: #555; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 16px; }
    button:disabled { background: #94a3b8; }
    .success { color: #16a34a; background: #dcfce7; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 20px; }
    .hint { font-size: 11px; color: #6b7280; font-weight: normal; margin-top: 2px; display: block; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="https://svccc.co.uk/wp-content/uploads/2018/10/logo3.jpg"></div>
  <h2>Trip Logger</h2>
  
  <form id="tripForm">
    <label>Select Member</label>
    <select name="memberName" id="memberSelect" required>
      <option value="">Loading members...</option>
    </select>
    
    <div style="display:flex; gap:10px;">
      <div style="flex:1">
        <label>Car</label>
        <select name="car" id="carSelect">
          <option value="Kia">Kia</option>
          <option value="Peugeot">Peugeot</option>
          <option value="Dacia">Dacia</option>
        </select>
      </div>
      <div style="flex:1">
        <label>Trip Date</label>
        <input type="date" name="tripDate" id="dateInput" required>
      </div>
    </div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1">
        <label>Start Time</label>
        <select name="startTime" id="startTimeSelect" required></select>
      </div>
      <div style="flex:1">
        <label>End Time</label>
        <select name="endTime" id="endTimeSelect" required></select>
      </div>
    </div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1">
        <label>Start Miles</label>
        <input type="number" step="0.1" name="startMileage" id="startMileageInput" required>
        <span class="hint" id="mileageHint">Pulling latest...</span>
      </div>
      <div style="flex:1">
        <label>End Miles</label>
        <input type="number" step="0.1" name="endMileage" required>
      </div>
    </div>

    <label>Petrol Cost (£)</label>
    <input type="number" step="0.01" name="petrolCost" value="0">

    <label>Upload Petrol Receipt (Photo)</label>
    <input type="file" id="receiptInput" accept="image/*">
    
    <label>Notes</label>
    <textarea name="notes"></textarea>
    
    <button type="submit" id="btn">Submit Trip Usage</button>
  </form>
  <div id="status"></div>
</div>

<script>
  // PASTE YOUR NEW GOOGLE WEB APP URL HERE:
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwQyeRq22wTRj46mpeyqBWjv5ted9m9dNA2ccmOPhJjs2EpIMTyMDfUwT3QIPkUZxQF/exec";
  
  let globalMileages = { "Kia": 0, "Peugeot": 0, "Dacia": 0 };

  // 1. Generate clean 30-minute dropdown interval blocks
  function populateTimeDropdowns() {
    const startSelect = document.getElementById('startTimeSelect');
    const endSelect = document.getElementById('endTimeSelect');
    
    let optionsHtml = '';
    for (let h = 0; h < 24; h++) {
      for (let m = 0; m < 60; m += 30) {
        const hh = String(h).padStart(2, '0');
        const mm = String(m).padStart(2, '0');
        const timeStr = `${hh}:${mm}`;
        optionsHtml += `<option value="${timeStr}">${timeStr}</option>`;
      }
    }
    startSelect.innerHTML = optionsHtml;
    endSelect.innerHTML = optionsHtml;

    // Default End Time to the closest half-hour step matching right now
    const now = new Date();
    let currentMin = now.getMinutes();
    let currentHour = now.getHours();
    
    if (currentMin >= 45) {
      currentHour = (currentHour + 1) % 24;
      currentMin = 0;
    } else if (currentMin >= 15) {
      currentMin = 30;
    } else {
      currentMin = 0;
    }
    
    const targetTimeStr = `${String(currentHour).padStart(2, '0')}:${String(currentMin).padStart(2, '0')}`;
    endSelect.value = targetTimeStr;
    
    // Default Start Time to 1 hour prior to keep spacing sensible
    let startHour = (currentHour - 1 + 24) % 24;
    startSelect.value = `${String(startHour).padStart(2, '0')}:${String(currentMin).padStart(2, '0')}`;
  }

  // 2. Adjust input value based on currently selected vehicle key
  function updateStartMileage() {
    const selectedCar = document.getElementById('carSelect').value;
    const lastKnown = globalMileages[selectedCar] || 0;
    document.getElementById('startMileageInput').value = lastKnown;
    document.getElementById('mileageHint').innerText = `Sheet value: ${lastKnown} mi`;
  }

  // 3. Connect to the spreadsheet API backend data assets
  async function loadInitialData() {
    try {
      const response = await fetch(WEB_APP_URL);
      const data = await response.json();
      
      // Map members dropdown
      const select = document.getElementById('memberSelect');
      select.innerHTML = '<option value="">-- Choose Member --</option>';
      data.members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = opt.text = m;
        select.add(opt);
      });

      // Stash odometer data and match visual field
      if (data.mileages) {
        globalMileages = data.mileages;
        updateStartMileage();
      }
    } catch (e) {
      document.getElementById('memberSelect').innerHTML = '<option value="">Error loading list</option>';
      document.getElementById('mileageHint').innerText = "Failed to sync";
    }
  }

  // Bind car selection field changes to the odometer lookup script engine
  document.getElementById('carSelect').addEventListener('change', updateStartMileage);

  // Initialization scripts
  populateTimeDropdowns();
  const params = new URLSearchParams(window.location.search);
  const carParam = params.get('car');
  if(carParam) {
    const carSelect = document.getElementById('carSelect');
    for (let i = 0; i < carSelect.options.length; i++) {
      if (carSelect.options[i].value.toLowerCase() === carParam.toLowerCase()) {
        carSelect.selectedIndex = i;
        break;
      }
    }
  }
  document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
  loadInitialData();

  const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
  });

  // Submission script loop handler pipeline 
  document.getElementById('tripForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    btn.disabled = true;
    btn.innerText = "Saving data records...";

    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    
    const fileInput = document.getElementById('receiptInput');
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const base64Str = await toBase64(file);
      data.receiptFile = { base64: base64Str, type: file.type };
    }

    try {
      await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors', 
        body: JSON.stringify(data)
      });
      status.innerHTML = "<div class='success'>✅ Logged! Spreadsheet and mileage updated.</div>";
      e.target.reset();
      document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
      populateTimeDropdowns();
      loadInitialData(); 
    } catch (err) {
      status.innerHTML = "<p style='color:red; text-align:center;'>Error: " + err.message + "</p>";
    } finally {
      btn.disabled = false;
      btn.innerText = "Submit Trip Usage";
    }
  };
</script>
</body>
</html>
