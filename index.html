<!DOCTYPE html>
<html>
<head>
  <title>SVCCC Trip Logger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { height: 50px; }
    h2 { text-align: center; color: #333; margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: bold; color: #555; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 25px; }
    button:disabled { background: #94a3b8; }
    .success { color: #16a34a; background: #dcfce7; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="https://svccc.co.uk/wp-content/uploads/2018/10/logo3.jpg"></div>
  <h2>Trip Logger</h2>
  
  <form id="tripForm">
    <label>Select Member</label>
    <select name="memberName" id="memberSelect" required>
      <option value="">Loading members...</option>
    </select>
    
    <div style="display:flex; gap:10px;">
      <div style="flex:1">
        <label>Car</label>
        <select name="car" id="carSelect">
          <option value="Kia">Kia</option>
          <option value="Astra">Astra</option>
          <option value="Dacia">Dacia</option>
        </select>
      </div>
      <div style="flex:1">
        <label>Trip Date</label>
        <input type="date" name="tripDate" id="dateInput" required>
      </div>
    </div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Start Time</label><input type="time" name="startTime" required></div>
      <div style="flex:1"><label>End Time</label><input type="time" name="endTime" required></div>
    </div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Start Miles</label><input type="number" step="0.1" name="startMileage" required></div>
      <div style="flex:1"><label>End Miles</label><input type="number" step="0.1" name="endMileage" required></div>
    </div>

    <label>Petrol Cost (£)</label>
    <input type="number" step="0.01" name="petrolCost" value="0">
    
    <label>Notes</label>
    <textarea name="notes"></textarea>
    
    <button type="submit" id="btn">Submit Trip Usage</button>
  </form>
  <div id="status"></div>
</div>

<script>
  // PASTE YOUR GOOGLE WEB APP URL HERE:
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwLViybtna4woFbw-MfH7WzhJctINBguBAFXhfP1P-hKIs9Krk9yhIJJcn5ASs5W75U/exec";

  // 1. Fetch member names automatically from Google Sheet
  async function loadMembers() {
    try {
      const response = await fetch(WEB_APP_URL);
      const members = await response.json();
      const select = document.getElementById('memberSelect');
      select.innerHTML = '<option value="">-- Choose Member --</option>';
      members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = opt.text = m;
        select.add(opt);
      });
    } catch (e) {
      document.getElementById('memberSelect').innerHTML = '<option value="">Error loading members</option>';
    }
  }

  // 2. Initialize page (Car selection, Date, and Members)
  const params = new URLSearchParams(window.location.search);
  const carParam = params.get('car');
  if(carParam) {
    const carSelect = document.getElementById('carSelect');
    for (let i = 0; i < carSelect.options.length; i++) {
      if (carSelect.options[i].value.toLowerCase() === carParam.toLowerCase()) {
        carSelect.selectedIndex = i;
        break;
      }
    }
  }
  document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
  loadMembers();

  // 3. Submit Logic
  document.getElementById('tripForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    btn.disabled = true;
    btn.innerText = "Saving...";

    const data = Object.fromEntries(new FormData(e.target));
    
    try {
      await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors', 
        body: JSON.stringify(data)
      });
      status.innerHTML = "<div class='success'>✅ Trip Recorded!</div>";
      e.target.reset();
      document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    } catch (err) {
      status.innerHTML = "<p style='color:red'>Error: " + err.message + "</p>";
    } finally {
      btn.disabled = false;
      btn.innerText = "Submit Trip Usage";
    }
  };
</script>
</body>
</html>
